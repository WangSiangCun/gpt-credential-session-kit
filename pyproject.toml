[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credential-session-kit"
version = "0.4.0"
description = "Existing-account access/session/refresh credential client"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"credential_session_kit.engine" = ["*.js"]
